    path: /api/v1/auth/profile
    headers: { Authorization: "Bearer x.y.z" }
    expect_status: 401
  - name: bad-token-query-in-path
    smoke: true
    method: GET
    path: /api/v1/catalog/colours?brandId=nope
    headers: { Authorization: "Bearer x" }
    expect_status: 401
  # ─── U1 auth ─────────────────────────────────────────────────────────────
  # `${run}` is a per-run hex id and `${target}` is node|py, so each service

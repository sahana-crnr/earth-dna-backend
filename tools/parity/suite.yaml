# Parity suite: every request is sent to Node and to Python; status and JSON
# body must be identical except the keys listed in `ignore`.
#
#   uv run python -m tools.parity.run --node http://localhost:1234 --py http://localhost:1235
#
# Each unit appends its routes here. Keys: name, method, path, headers?, json?,
# body? (raw string), ignore? (extra JSON paths to ignore for this case),
# expect_status? (sanity, applies to both).
ignore:
  - timestamp
  - url            # presigned URLs differ by signature and date
  - thumbnailUrl
  - photoUrl
  # server-side clocks: every stored timestamp differs between the two runs
  - createdAt
  - updatedAt
  - submittedAt
  - finishedAt
  - sharedAt
  - computedAt
  - actionTakenAt
  - valueComputedAt
  # The placeholder value (recommendation + resale range) is picked by a hash
  # of the scan-shoe id, which differs per target. The hash itself is pinned
  # against a Node golden in tests/scan/test_result_review_rules.py.
  - recommendedAction
  - resale
  - resaleBucket
  - recommendation
  - value
  - potentialValue
  - demandNote
cases:
  # ─── U0 foundation ───────────────────────────────────────────────────────
  - name: health
    smoke: true
    method: GET
    path: /api/v1
    expect_status: 200
  - name: unknown-route
    smoke: true
    method: GET
    path: /api/v1/nope
    expect_status: 404
  - name: unknown-method

[project]
name = "earth-dna-backend"
version = "2.0.0"
description = "Earth DNA REST API (Python / FastAPI). Same contract as the NestJS service it replaces."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
dependencies = [
    "fastapi>=0.115",
    "starlette>=1.1.0",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pyjwt[crypto]>=2.10,<3",
    "bcrypt>=4.2,<5",
    "python-multipart>=0.0.17,<0.1",
    "httpx>=0.27,<0.29",
    "boto3>=1.35,<2",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115,<7",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=4.0,<5",
    "pyyaml>=6.0,<7",
    "types-pyyaml",
    "boto3-stubs[s3,ses,secretsmanager]>=1.35,<2",
    "asgi-lifespan>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff: lint + format (replaces ESLint + Prettier) ────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests", "tools", "alembic"]
extend-exclude = ["node_modules", "dist", "src", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "N", "ANN"]
ignore = [
    "ANN401", # Any in a few framework hooks
    "ANN101", # self / cls annotations (deprecated rule)
    "ANN102",
    "S101",   # assert is fine in tests (scoped below) and invariants
    "RUF012", # mutable class attrs — Pydantic / SQLAlchemy idioms
    "B008",   # Depends(...) in defaults is the FastAPI idiom
    "N818",   # ApiError / ValidationFailed naming follows the Node code
    "E501",   # ruff format owns line width; long literals stay readable
    "N815",   # request/response fields keep the API's camelCase names
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "B011", "RUF001", "RUF002"]
"alembic/**" = ["ANN", "E501"]
"tools/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── mypy: type check (replaces tsc --noEmit) ────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tools"]
exclude = ["node_modules", "dist", "src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "asyncpg.*"]
ignore_missing_imports = true

# Routers hand back whatever the service on app.state returns (untyped state).
[[tool.mypy.overrides]]
module = ["app.api.*"]
warn_return_any = false
warn_unused_ignores = false

# ─── pytest (replaces jest) ──────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -ra"
markers = [
    "db: needs local Postgres (PY_IT_DB=1), mirrors the Node SCAN_IT_DB suites",
]

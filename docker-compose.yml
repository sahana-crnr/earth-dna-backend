# Local run of the backend image next to a throwaway Postgres.
#   docker compose up --build
# For day-to-day development use `uv run uvicorn` against the Postgres in
# ../local-infra instead (README).
services:
  app:
    build: .
    image: earth-dna-be:local
    container_name: earth_dna_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '1234:1234'
    environment:
      APP_ENV: local
      PORT: 1234
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-earth_dna}
      DB_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
      MAIL_DRY_RUN: 'true'

  postgres:
    image: postgres:16-alpine
    container_name: earth_dna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-earth_dna}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-earth_dna}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

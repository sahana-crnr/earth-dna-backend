<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Your Password — Earth DNA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 40px 48px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      width: 100%;
      max-width: 440px;
    }
    .logo {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1a1a2e;
      margin-bottom: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: #1a1a2e; }
    p  { color: #666; font-size: 14px; margin: 0 0 24px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 18px;
      transition: border-color .2s;
    }
    input[type="password"]:focus { outline: none; border-color: #0f3460; }
    button {
      width: 100%;
      padding: 13px;
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #1a1a2e; }
    button:disabled { background: #999; cursor: not-allowed; }
    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .msg.success { background: #e6f4ea; color: #2e7d32; }
    .msg.error   { background: #fdecea; color: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Earth DNA</div>
    <h1>Reset Your Password</h1>
    <p>Enter and confirm your new password below.</p>

    <form id="resetForm">
      <input type="hidden" id="token" value="${safeToken}" />

      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        placeholder="Min. 8 characters"
        required
        minlength="8"
        maxlength="72"
      />

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Repeat your new password"
        required
        minlength="8"
        maxlength="72"
      />

      <button type="submit" id="submitBtn">Set New Password</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const token       = document.getElementById('token').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPwd  = document.getElementById('confirmPassword').value;
      const msg         = document.getElementById('msg');
      const btn         = document.getElementById('submitBtn');

      msg.style.display = 'none';

      if (newPassword !== confirmPwd) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match. Please try again.';
        msg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Processing…';

      try {
        // POST to the same pathname (GET and POST share /auth/reset-password)
        const res  = await fetch(window.location.origin + window.location.pathname, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, confirmPassword: confirmPwd }),
        });

        const data = await res.json();

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent =
            data.data?.message ||
            'Password reset successfully! You can now log in with your new password.';
          msg.style.display = 'block';
          btn.textContent = 'Done ✓';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message || 'Something went wrong. Please try again.';
          msg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Set New Password';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please check your connection and try again.';
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Set New Password';
      }
    });
  </script>
</body>
</html>
